{% extends "base.html" %}

{% block title %}New Expense{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="text-center mb-4">
                <div style="font-size: 3rem;">💸</div>
                <h2 class="fw-bold mt-2">Add New Expense</h2>
                <p class="text-muted">Record a new expense</p>
            </div>

            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="amount" class="form-label"><i class="fas fa-dollar-sign me-1 text-success"></i> Amount *</label>
                        <input type="number" step="0.01" min="0.01" class="form-control" id="amount" name="amount"
                               value="{{ amount or '' }}" placeholder="0.00" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="date" class="form-label"><i class="fas fa-calendar me-1 text-success"></i> Date *</label>
                        <input type="date" class="form-control" id="date" name="date"
                               value="{{ date or '' }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="category" class="form-label"><i class="fas fa-tag me-1 text-success"></i> Category *</label>
                    <select class="form-select" id="category" name="category" required>
                        <option value="">-- Select a category --</option>
                        <option value="Food" {% if category == 'Food' %}selected{% endif %}>🍔 Food & Dining</option>
                        <option value="Transport" {% if category == 'Transport' %}selected{% endif %}>🚗 Transport</option>
                        <option value="Bills" {% if category == 'Bills' %}selected{% endif %}>💡 Bills & Utilities</option>
                        <option value="Shopping" {% if category == 'Shopping' %}selected{% endif %}>🛍️ Shopping</option>
                        <option value="Entertainment" {% if category == 'Entertainment' %}selected{% endif %}>🎬 Entertainment</option>
                        <option value="Health" {% if category == 'Health' %}selected{% endif %}>💊 Health</option>
                        <option value="Education" {% if category == 'Education' %}selected{% endif %}>📚 Education</option>
                        <option value="Other" {% if category == 'Other' %}selected{% endif %}>📦 Other</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label"><i class="fas fa-align-left me-1 text-success"></i> Description <small class="text-muted">(optional)</small></label>
                    <input type="text" class="form-control" id="description" name="description"
                           value="{{ description or '' }}" placeholder="e.g., Lunch at cafe">
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <button type="submit" class="btn btn-success flex-fill py-3">
                        <i class="fas fa-save me-1"></i> Save Expense
                    </button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary flex-fill py-3">
                        <i class="fas fa-times me-1"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
