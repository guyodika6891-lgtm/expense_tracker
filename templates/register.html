{% extends "base.html" %}

{% block title %}Register - Expense Tracker{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-4">
                <div style="font-size: 3rem;">📝</div>
                <h2 class="fw-bold mt-2">Create Account</h2>
                <p class="text-muted">Start tracking your expenses</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label"><i class="fas fa-user me-1 text-success"></i> Username</label>
                    <input type="text" class="form-control" id="username" name="username"
                           value="{{ username or '' }}" placeholder="Choose a username" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label"><i class="fas fa-envelope me-1 text-success"></i> Email</label>
                    <input type="email" class="form-control" id="email" name="email"
                           value="{{ email or '' }}" placeholder="your@email.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label"><i class="fas fa-lock me-1 text-success"></i> Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Minimum 6 characters" required>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label"><i class="fas fa-lock me-1 text-success"></i> Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                           placeholder="Repeat your password" required>
                </div>

                <button type="submit" class="btn btn-success w-100 py-3">
                    <i class="fas fa-user-plus me-1"></i> Create Account
                </button>
            </form>

            <p class="text-center mt-4 mb-0">
                Already have an account?
                <a href="{{ url_for('login') }}" class="text-success fw-bold text-decoration-none">Login here</a>
            </p>
        </div>
    </div>
{% endblock %}
