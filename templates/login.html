{% extends "base.html" %}

{% block title %}Login - Expense Tracker{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-4">
                <div style="font-size: 3rem;">🔑</div>
                <h2 class="fw-bold mt-2">Welcome Back</h2>
                <p class="text-muted">Login to your account</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label"><i class="fas fa-user me-1 text-success"></i> Username</label>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Your username" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label"><i class="fas fa-lock me-1 text-success"></i> Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Your password" required>
                </div>

                <button type="submit" class="btn btn-success w-100 py-3">
                    <i class="fas fa-sign-in-alt me-1"></i> Login
                </button>
            </form>

            <p class="text-center mt-4 mb-0">
                Don't have an account?
                <a href="{{ url_for('register') }}" class="text-success fw-bold text-decoration-none">Register here</a>
            </p>
        </div>
    </div>
{% endblock %}
